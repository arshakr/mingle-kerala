<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover — Mingle Kerala</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<!-- App Header -->
<header class="app-header" style="position:sticky;top:0;z-index:100">
  <div class="app-header-left">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <div class="app-logo" style="margin-left:12px"><span class="text-gradient">Discover</span></div>
  </div>
  <div class="app-header-right">
    <div class="user-pill" id="userPill">
      <span class="online-dot"></span>
      <span id="headerUsername">—</span>
    </div>
  </div>
</header>

<div style="max-width:1200px;margin:0 auto;padding:24px">
  <div class="discover-layout">

    <!-- ── Filter Sidebar ─────────────────────────────── -->
    <aside class="filter-sidebar">
      <div class="filter-card">
        <div style="font-size:1rem;font-weight:700;margin-bottom:20px">🔍 Filters</div>

        <!-- Online Only -->
        <div class="filter-section">
          <div class="filter-section-title">Status</div>
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.85rem">
            <div class="toggle-switch">
              <input type="checkbox" id="onlineToggle" />
              <span class="toggle-slider"></span>
            </div>
            Online Only
          </label>
        </div>

        <!-- District -->
        <div class="filter-section">
          <div class="filter-section-title">District</div>
          <div class="filter-chips-wrap" id="districtFilters">
            <div class="filter-chip active" data-district="">All Districts</div>
          </div>
        </div>

        <!-- Gender -->
        <div class="filter-section">
          <div class="filter-section-title">Gender</div>
          <div class="filter-chips-wrap">
            <div class="filter-chip active" data-gender="">All</div>
            <div class="filter-chip" data-gender="Male">Male</div>
            <div class="filter-chip" data-gender="Female">Female</div>
          </div>
        </div>

        <!-- Interests -->
        <div class="filter-section">
          <div class="filter-section-title">Interests</div>
          <div class="filter-chips-wrap" id="interestFilters">
            <div class="filter-chip active" data-interest="">Any</div>
            <div class="filter-chip" data-interest="Music">🎵 Music</div>
            <div class="filter-chip" data-interest="Movies">🎬 Movies</div>
            <div class="filter-chip" data-interest="Food">🍛 Food</div>
            <div class="filter-chip" data-interest="Travel">✈️ Travel</div>
            <div class="filter-chip" data-interest="Sports">⚽ Sports</div>
            <div class="filter-chip" data-interest="Gaming">🎮 Gaming</div>
            <div class="filter-chip" data-interest="Art">🎨 Art</div>
            <div class="filter-chip" data-interest="Tech">💻 Tech</div>
            <div class="filter-chip" data-interest="Books">📚 Books</div>
            <div class="filter-chip" data-interest="Nature">🌿 Nature</div>
          </div>
        </div>

        <button class="btn btn-ghost w-full btn-sm" id="clearFilters">Clear All Filters</button>
      </div>
    </aside>

    <!-- ── Results ────────────────────────────────────── -->
    <div class="filter-results">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <div>
          <h2 style="font-size:1.1rem;font-weight:700">People in Kerala</h2>
          <div class="text-muted" style="font-size:0.8rem;margin-top:2px" id="resultCount">Showing all users</div>
        </div>
        <div class="badge badge-online">
          <span class="pulse-dot"></span>
          <span id="onlineCountBadge">0</span> Online
        </div>
      </div>

      <div class="discover-grid" id="discoverGrid"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/utils.js"></script>
<script>
  window.requireAuth('login.html');

  const user = window.getUser();
  if (user) {
    document.getElementById('headerUsername').textContent = user.name;
  }

  // Filters state
  let filters = { online: false, district: '', gender: '', interest: '' };

  // Populate district filter chips
  const districtFilters = document.getElementById('districtFilters');
  window.KERALA_DISTRICTS.forEach(d => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip';
    chip.dataset.district = d;
    chip.textContent = d;
    districtFilters.appendChild(chip);
  });

  // Online badge count
  document.getElementById('onlineCountBadge').textContent = window.MOCK_USERS.filter(u => u.online).length;

  function applyFilters() {
    let users = [...window.MOCK_USERS];
    if (filters.online)    users = users.filter(u => u.online);
    if (filters.district)  users = users.filter(u => u.district === filters.district);
    if (filters.gender)    users = users.filter(u => u.gender === filters.gender);
    if (filters.interest)  users = users.filter(u => u.interests.includes(filters.interest));
    renderResults(users);
  }

  function renderResults(users) {
    const grid = document.getElementById('discoverGrid');
    grid.innerHTML = '';
    document.getElementById('resultCount').textContent = `Showing ${users.length} user${users.length !== 1 ? 's' : ''}`;

    if (users.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-state-icon">😔</div>
          <h3>No users match your filters</h3>
          <p>Try clearing some filters to see more people.</p>
          <button class="btn btn-ghost btn-sm mt-16" onclick="document.getElementById('clearFilters').click()">Clear Filters</button>
        </div>
      `;
      return;
    }

    users.forEach(u => {
      const card = window.renderUserCard(u, (peer) => {
        window.storage.set('mk_chat_peer', peer);
        window.navigateTo('chat.html');
      });
      card.classList.add('reveal');
      grid.appendChild(card);
    });
    window.initScrollReveal();
  }

  applyFilters();

  // Single-select helper
  function setupSingleSelect(container, key) {
    container.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filters[key] = chip.dataset[key] || '';
        applyFilters();
      });
    });
  }

  setupSingleSelect(document.getElementById('districtFilters'), 'district');
  setupSingleSelect(document.querySelector('.filter-section:nth-child(3) .filter-chips-wrap'), 'gender');
  setupSingleSelect(document.getElementById('interestFilters'), 'interest');

  // Online toggle
  document.getElementById('onlineToggle').addEventListener('change', (e) => {
    filters.online = e.target.checked;
    applyFilters();
  });

  // Clear filters
  document.getElementById('clearFilters').addEventListener('click', () => {
    filters = { online: false, district: '', gender: '', interest: '' };
    document.getElementById('onlineToggle').checked = false;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.filter-chip[data-district=""]').forEach(c => c.classList.add('active'));
    document.querySelectorAll('.filter-chip[data-gender=""]').forEach(c => c.classList.add('active'));
    document.querySelectorAll('.filter-chip[data-interest=""]').forEach(c => c.classList.add('active'));
    applyFilters();
    window.showToast('Filters cleared', 'info');
  });
</script>
</body>
</html>
