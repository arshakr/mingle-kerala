services:
  - type: web
    name: mingle-kerala-api
    runtime: node
    plan: starter
    rootDir: next-backend
    buildCommand: npm ci
    preDeployCommand: npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://minglekerala.in
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
