services:
  - type: web
    name: mingle-kerala-api
    runtime: node
    plan: free
    rootDir: next-backend
    buildCommand: npm ci && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://arshakr.github.io/mingle-kerala
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
