name: Mingle Kerala DEV app checks
on:
  push:
    branches:
      - feat/mingle-kerala-dev-*
      - chore/development-cleanup-*
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/dev-app-ci.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Static typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
